name: Refresh GitHub stats

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      lines:
        description: 'Also sum lines written (slow)'
        type: boolean
        default: true

concurrency:
  group: github-stats
  cancel-in-progress: false

permissions:
  contents: write # push the refreshed JSON
  actions: write # dispatch CI so the new stats get deployed

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      STATS_FILE: src/pages/About/github-stats.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The script only uses Node built-ins, so no npm ci needed.
      - name: Fetch stats
        run: node scripts/github-stats.mjs ${{ (github.event_name == 'schedule' || inputs.lines) && '--lines' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # fetchedAt changes on every run; only commit when the actual numbers moved.
      - name: Check for changes
        id: diff
        run: |
          if git show "HEAD:$STATS_FILE" | jq -S 'del(.fetchedAt)' > /tmp/old.json \
            && jq -S 'del(.fetchedAt)' "$STATS_FILE" > /tmp/new.json \
            && cmp -s /tmp/old.json /tmp/new.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No stat changes; skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STATS_FILE"
          git commit -m 'chore: refresh GitHub stats'
          git push

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so kick CI
      # (and its deploy job) explicitly.
      - name: Trigger CI / deploy
        if: steps.diff.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
